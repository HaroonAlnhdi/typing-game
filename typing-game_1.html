<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سرعة الكتابة · Typing Speed</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Reem+Kufi:wght@600;700&display=swap">
<style>
:root{--p:#0f3a63;--pt:#fff;--bg:#fff;--sf:#f6f8fa;--bd:#d9dee4;--tx:#1b2430;--mu:#5b6675;--ok:#0f3a63;--ok-bg:#e6eef6;--er:#c0262d;--er-bg:#fde8e9;--sh:0 2px 12px rgba(15,58,99,.08);--r:10px;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1319;--sf:#161d26;--bd:#2b3644;--tx:#e8edf3;--mu:#9aa6b5;--p:#5b9bd5;--pt:#0e1319;--ok:#7fb4e6;--ok-bg:#1a2b3d;--er:#ff7b80;--er-bg:#3a1a1c;--sh:0 2px 12px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#0e1319;--sf:#161d26;--bd:#2b3644;--tx:#e8edf3;--mu:#9aa6b5;--p:#5b9bd5;--pt:#0e1319;--ok:#7fb4e6;--ok-bg:#1a2b3d;--er:#ff7b80;--er-bg:#3a1a1c;--sh:0 2px 12px rgba(0,0,0,.4)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:400 1rem/1.7 "IBM Plex Sans Arabic","IBM Plex Sans",system-ui,sans-serif}
html[lang=en] body{font-family:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,sans-serif}
.skip{position:absolute;inset-inline-start:8px;top:-60px;background:var(--p);color:var(--pt);padding:12px 16px;border-radius:var(--r);z-index:9;min-height:44px}
.skip:focus{top:8px}
:focus-visible{outline:3px solid #e0a100;outline-offset:2px}
header{background:#0f3a63;color:#fff}
.bar{max-width:1100px;margin:auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-size:1.25rem;margin:0;font-weight:700}
.tools{display:flex;gap:8px}
button,.btn{font:inherit;cursor:pointer;min-height:44px;min-width:44px;padding:0 18px;border-radius:var(--r);border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-weight:500}
header button{background:transparent;color:#fff;border-color:rgba(255,255,255,.45)}
button.primary{background:var(--p);color:var(--pt);border-color:var(--p);font-weight:600}
button:hover{box-shadow:var(--sh)}
main{max-width:1100px;margin:auto;padding:28px 20px 56px}
ol.steps{list-style:none;display:flex;gap:8px;padding:0;margin:0 0 28px}
.steps li{flex:1;padding:10px 12px;border-radius:var(--r);background:var(--sf);color:var(--mu);font-size:.9rem;text-align:center;border-bottom:3px solid transparent}
.steps li[aria-current=step]{color:var(--ok);background:var(--ok-bg);border-color:var(--p);font-weight:600}
.card{background:var(--bg);border:1px solid var(--bd);border-radius:14px;box-shadow:var(--sh);padding:28px}
fieldset{border:0;padding:0;margin:0 0 26px}
legend,label.l{font-weight:600;margin-bottom:10px;display:block;padding:0}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg label{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border:1px solid var(--bd);border-radius:var(--r);cursor:pointer;background:var(--bg)}
.seg input:checked+label{background:var(--p);color:var(--pt);border-color:var(--p);font-weight:600}
.seg input:focus-visible+label{outline:3px solid #e0a100;outline-offset:2px}
input[type=number]{font:inherit;min-height:44px;width:140px;padding:0 12px;border-radius:var(--r);border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
input[aria-invalid=true]{border-color:var(--er)}
.err{color:var(--er);font-size:.9rem;min-height:1.4em;margin:6px 0 0}
.hint{color:var(--mu);font-size:.9rem;margin:6px 0 0}
.hud{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.hud div{flex:1;min-width:90px;background:var(--sf);border-radius:var(--r);padding:10px 14px}
.hud b{display:block;font-size:1.6rem;font-variant-numeric:tabular-nums;color:var(--ok);line-height:1.3}
.hud span{color:var(--mu);font-size:.85rem}
#text{font-size:1.45rem;line-height:2.2;max-height:11.5em;overflow:hidden;padding:18px 20px;border-radius:var(--r);background:var(--sf);border:1px solid var(--bd);user-select:none;color:var(--mu);word-break:break-word}
#text .c{color:var(--ok);background:var(--ok-bg)}
#text .x{color:var(--er);background:var(--er-bg);text-decoration:underline}
#text .cur{background:var(--p);color:var(--pt);border-radius:3px}
#in{width:100%;margin-top:14px;font:inherit;font-size:1.15rem;min-height:92px;padding:12px 14px;border-radius:var(--r);border:2px solid var(--bd);background:var(--bg);color:var(--tx);resize:none}
.prog{height:6px;background:var(--bd);border-radius:6px;margin-bottom:16px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--p);transition:width .2s}
.actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:18px 0}
.grid div{background:var(--sf);border-radius:var(--r);padding:14px}
.grid b{display:block;font-size:1.5rem;color:var(--ok);font-variant-numeric:tabular-nums}
.grid span{color:var(--mu);font-size:.88rem}
.badge{display:inline-block;background:var(--ok-bg);color:var(--ok);padding:4px 12px;border-radius:99px;font-weight:600;margin-bottom:8px}
h2{margin:0 0 6px;font-size:1.4rem}h3{margin:30px 0 10px;font-size:1.1rem}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th,td{padding:10px 8px;text-align:start;border-bottom:1px solid var(--bd);font-variant-numeric:tabular-nums}
th{color:var(--mu);font-weight:500}
.wrap{overflow-x:auto}
[hidden]{display:none!important}
@media (max-width:560px){.card{padding:18px}#text{font-size:1.2rem}.steps li{font-size:.78rem;padding:8px 4px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
#text{position:relative}#in:focus{border-color:var(--p)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
.side{display:grid;gap:24px;position:sticky;top:16px}.side .card{padding:20px}
.side .grid{grid-template-columns:repeat(2,1fr);margin:14px 0 0}.side .grid b{font-size:1.25rem}
.ph{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:6px}
.ib{padding:0;display:inline-flex;align-items:center;justify-content:center}
.ib svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
dialog{border:1px solid var(--bd);border-radius:14px;padding:26px;max-width:520px;width:calc(100% - 32px);background:var(--bg);color:var(--tx);box-shadow:var(--sh);font:inherit}
dialog::backdrop{background:rgba(15,58,99,.5)}
@media (max-width:900px){.layout{grid-template-columns:1fr}.side{position:static}}
.foot{max-width:1100px;margin:0 auto;padding:20px;text-align:center;color:var(--mu);font-size:.9rem;border-top:1px solid var(--bd)}
.hbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%}
.hbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#hdlg{max-width:600px}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
#res.show{animation:rise .5s cubic-bezier(.2,.8,.2,1)}
#res.show .grid div{animation:rise .45s both;animation-delay:calc(var(--i)*70ms + 150ms)}
#res.show .badge{animation:pop .5s .1s both}
.logo{display:flex;align-items:center;gap:12px;margin:0;font:700 1.65rem/1 "Reem Kufi","IBM Plex Sans Arabic","IBM Plex Sans",sans-serif;color:#fff}
html[lang=en] .logo{letter-spacing:.03em}
.mark{width:38px;height:38px;flex:none}
.wm{display:inline-flex;align-items:center;gap:7px;padding-top:2px}
.caret{width:3px;height:1.15em;background:#fff;border-radius:2px;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (max-width:420px){.logo{font-size:1.3rem;gap:9px}.mark{width:32px;height:32px}}
</style>
</head>
<body>
<a class="skip" href="#main" data-i="skip"></a>
<header><div class="bar">
<h1 class="logo"><svg class="mark" viewBox="0 0 40 40" aria-hidden="true"><rect x="2" y="2" width="36" height="36" rx="10" fill="#fff"/><path d="M11 13h18M20 13v13" stroke="#0f3a63" stroke-width="4.5" stroke-linecap="round" fill="none"/><path d="M24 31h6" stroke="#0f3a63" stroke-width="3" stroke-linecap="round" fill="none"/></svg><span class="wm"><span data-i="title"></span><i class="caret" aria-hidden="true"></i></span></h1>
<div class="tools">
<button id="lang" type="button" aria-label="Language"></button>
<button id="theme" class="ib" type="button" data-al="theme" aria-pressed="false"></button>
</div></div></header>

<main id="main" tabindex="-1">
<div class="layout">
<section id="play" class="card" aria-labelledby="h-play">
<div class="ph"><h2 id="h-play" data-i="typeH"></h2>
<div class="tools"><button class="ib" id="shuffle" type="button" data-al="shuffle"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg></button><button class="ib" id="gear" type="button" data-al="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg></button></div></div>
<p class="hint" id="sum" style="margin:0 0 16px"></p>
<div class="hud">
<div><b id="hT">0</b><span data-i="hTime"></span></div><div><b id="hW">0</b><span data-i="wpm"></span></div>
<div><b id="hA">100%</b><span data-i="acc"></span></div><div><b id="hE">0</b><span data-i="errs"></span></div></div>
<div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="pb"><i id="pbi"></i></div>
<div id="text" aria-hidden="true"></div>
<label class="l" for="in" style="margin-top:14px" data-i="inLbl"></label>
<textarea id="in" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-describedby="inHint" disabled></textarea>
<p class="hint" id="inHint" data-i="inHint"></p>
<div class="actions"><button class="primary" id="start" type="button"></button><button type="button" id="quit" data-i="quit" hidden></button></div>
</section>
<aside class="side">
<section class="card" id="res" aria-labelledby="h-res" aria-live="polite">
<span class="badge" id="rBadge" hidden></span><h2 id="h-res" data-i="resH"></h2><p class="hint" id="rEmpty" data-i="resEmpty"></p>
<div class="grid" id="rGrid"></div>
</section>
<button type="button" id="histBtn" class="hbtn"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span data-i="histH"></span></button></aside></div></main><footer class="foot" data-i="credit"></footer>
<dialog id="hdlg" aria-labelledby="h-hist"><div id="hist">
<h2 id="h-hist" data-i="histH"></h2><div class="grid" id="hGrid"></div>
<h3 data-i="last3"></h3>
<div class="wrap"><table><thead><tr><th data-i="date"></th><th data-i="wpm"></th><th data-i="acc"></th><th data-i="words"></th><th data-i="mode"></th></tr></thead><tbody id="hBody"></tbody></table></div>
<p class="hint" id="noHist" data-i="noHist"></p></div>
<div class="actions"><button type="button" id="clear" data-i="clear"></button><button type="button" id="hclose" data-i="close"></button></div>
</dialog>
<dialog id="dlg" aria-labelledby="h-setup">
<h2 id="h-setup" data-i="setupH"></h2><p class="hint" data-i="setupP" style="margin-bottom:22px"></p>
<fieldset><legend data-i="mode"></legend><div class="seg">
<input type="radio" name="mode" id="m1" value="timed" checked><label for="m1" data-i="mTimed"></label>
<input type="radio" name="mode" id="m2" value="passage"><label for="m2" data-i="mPass"></label></div><p class="hint" id="modeHint"></p></fieldset>
<fieldset id="timeSet"><legend data-i="time"></legend><div class="seg">
<input type="radio" name="time" id="t30" value="30"><label for="t30">30 <span data-i="sec"></span></label>
<input type="radio" name="time" id="t60" value="60" checked><label for="t60">60 <span data-i="sec"></span></label>
<input type="radio" name="time" id="t120" value="120"><label for="t120">120 <span data-i="sec"></span></label>
<input type="radio" name="time" id="tc" value="custom"><label for="tc" data-i="custom"></label></div>
<div id="customBox" hidden style="margin-top:14px"><label class="l" for="cust" data-i="custLbl"></label>
<input type="number" id="cust" inputmode="numeric" min="10" max="600" value="45" aria-describedby="custErr"><p class="err" id="custErr" role="alert"></p></div></fieldset>
<fieldset><legend data-i="tlang"></legend><div class="seg">
<input type="radio" name="tl" id="l1" value="ar" checked><label for="l1">العربية</label>
<input type="radio" name="tl" id="l2" value="en"><label for="l2">English</label>
<input type="radio" name="tl" id="l3" value="mix"><label for="l3" data-i="random"></label></div></fieldset>
<div class="actions"><button class="primary" id="apply" type="button" data-i="apply"></button><button id="cancel" type="button" data-i="cancel"></button></div>
</dialog>

<script>
// ===== Passages (add more freely) =====
const TXT={
ar:[
"الكتابة السريعة مهارة تتحسن بالتدريب المنتظم، فكلما جلست أمام لوحة المفاتيح بهدوء وتركيز، صارت أصابعك تعرف مواضع الحروف دون النظر إليها.",
"في الصباح الباكر تمتلئ الشوارع بالحياة، ويخرج الناس إلى أعمالهم وفي قلوبهم أمل جديد، وتفوح من المخابز رائحة الخبز الطازج.",
"القراءة نافذة واسعة على العالم، تأخذنا إلى أماكن لم نزرها وتعرفنا بأشخاص لم نلتق بهم، وتمنحنا أفكارًا جديدة في كل صفحة نقلبها.",
"البحر هادئ عند الغروب، والأمواج تداعب الرمال بلطف، والنوارس تحلق في السماء الملونة بين البرتقالي والأرجواني.",
"التكنولوجيا غيّرت طريقة عيشنا وعملنا وتعلمنا، ومع ذلك يبقى الإنسان هو المحور الذي تدور حوله كل الابتكارات والاختراعات.",
"الصبر مفتاح الفرج، ومن زرع الجد حصد النجاح، فلا تستعجل النتائج ولا تقارن مسيرتك بمسيرة غيرك، فلكل إنسان طريقه وإيقاعه.",
"تبدأ كل رحلة طويلة بخطوة واحدة صغيرة، والمهم أن تبدأ اليوم وتستمر بثبات، فالتقدم اليسير المتواصل يتفوق على الحماس المتقطع."],
en:[
"Typing quickly is a skill that grows with steady practice. The more calmly you sit and focus, the more your fingers learn where every key lives.",
"Early in the morning the streets fill with life as people head to work with fresh hope, and the smell of warm bread drifts from the bakery.",
"Reading opens a wide window to the world. It takes us to places we have never visited and introduces us to people we have never met.",
"The sea is calm at sunset, and the waves touch the sand gently while gulls glide through a sky painted orange and purple.",
"Technology has changed how we live, work and learn, yet people remain at the center of every invention and every new idea.",
"Patience is the key to progress. Do not rush the results or compare your journey to anyone else's, because every path has its own pace.",
"Every long journey begins with one small step. What matters is to start today and keep going, since small steady progress beats bursts of effort."]};

// ===== UI strings =====
const I={ar:{title:"سرعة الكتابة",skip:"تخطَّ إلى المحتوى",st1:"الإعداد",st2:"الكتابة",st3:"النتيجة",setupH:"جهّز تحديك",setupP:"اختر طريقة اللعب واللغة، ثم ابدأ. يبدأ العدّاد عند أول حرف تكتبه.",mode:"طريقة اللعب",mTimed:"وقت محدد",mPass:"فقرة كاملة",time:"المدة",sec:"ثانية",custom:"مخصص",custLbl:"المدة بالثواني (10 – 600)",tlang:"لغة النص",random:"عشوائي",start:"ابدأ اللعب",typeH:"اكتب النص",hTime:"الوقت",wpm:"كلمة/د",acc:"الدقة",errs:"أخطاء",inLbl:"اكتب هنا",inHint:"اللصق معطّل. استخدم Backspace للتصحيح.",restart:"إعادة",quit:"إنهاء",resH:"نتيجتك",again:"العب مجددًا",change:"تغيير الإعدادات",histH:"سجلّك",last3:"آخر ٣ نتائج",date:"التاريخ",words:"كلمات",noHist:"لا توجد نتائج بعد. ابدأ أول جولة!",clear:"مسح السجل",hint1:"تنتهي الجولة عند انتهاء الوقت. يتجدد النص تلقائيًا إن أنهيته.",hint2:"يُحسب الزمن من أول حرف حتى آخر حرف في الفقرة.",errRange:"أدخل رقمًا صحيحًا بين 10 و600.",best:"أعلى نتيجة",worst:"أقل نتيجة",avg:"المتوسط",games:"عدد الجولات",totalW:"مجموع الكلمات",bestAcc:"أفضل دقة",time2:"المدة",wordsT:"كلمات صحيحة",raw:"السرعة الخام",chars:"حروف صحيحة",typedAll:"كل الضغطات",del:"حروف محذوفة",errT:"إجمالي الأخطاء",wpmL:"السرعة (كلمة/د)",accL:"الدقة",rec:"رقم قياسي جديد!",lvl:["مبتدئ","جيد","سريع","محترف"],mT:"وقت",mP:"فقرة",confirm:"مسح كل النتائج المحفوظة؟",theme:"الوضع الداكن",lang:"English",s:"ث"},
en:{title:"Typing Speed",skip:"Skip to content",st1:"Setup",st2:"Type",st3:"Result",setupH:"Set up your challenge",setupP:"Pick a mode and language, then start. The clock begins at your first keystroke.",mode:"Mode",mTimed:"Timed",mPass:"Full passage",time:"Duration",sec:"sec",custom:"Custom",custLbl:"Duration in seconds (10 – 600)",tlang:"Text language",random:"Random",start:"Start",typeH:"Type the text",hTime:"Time",wpm:"WPM",acc:"Accuracy",errs:"Errors",inLbl:"Type here",inHint:"Pasting is disabled. Use Backspace to fix mistakes.",restart:"Restart",quit:"Finish",resH:"Your result",again:"Play again",change:"Change settings",histH:"Your history",last3:"Last 3 results",date:"Date",words:"Words",noHist:"No results yet. Play your first round!",clear:"Clear history",hint1:"The round ends when time is up. New text appears if you finish early.",hint2:"Timed from your first keystroke to the last character of the passage.",errRange:"Enter a whole number between 10 and 600.",best:"Best score",worst:"Lowest score",avg:"Average",games:"Rounds played",totalW:"Total words",bestAcc:"Best accuracy",time2:"Duration",wordsT:"Correct words",raw:"Raw speed",chars:"Correct characters",typedAll:"Keystrokes",del:"Deleted characters",errT:"Total mistakes",wpmL:"Speed (WPM)",accL:"Accuracy",rec:"New personal best!",lvl:["Beginner","Good","Fast","Expert"],mT:"Timed",mP:"Passage",confirm:"Delete all saved results?",theme:"Dark mode",lang:"العربية",s:"s"}};

Object.assign(I.ar,{shuffle:"نص جديد",settings:"الإعدادات",apply:"تطبيق",cancel:"إلغاء",resEmpty:"أنهِ جولة لتظهر نتيجتك هنا."});
Object.assign(I.en,{shuffle:"New text",settings:"Settings",apply:"Apply",cancel:"Cancel",resEmpty:"Finish a round to see your result here."});
Object.assign(I.ar,{credit:"© 2026 جميع الحقوق محفوظة · تم تطويره من قبل هارون النهدي",close:"إغلاق"});
Object.assign(I.en,{credit:"© 2026 All rights reserved · Developed by Haroon Al-Nahdi",close:"Close"});
const DIAC=/[\u064B-\u065F\u0670\u0640\u200B-\u200F]/g;
const norm=t=>t.normalize("NFC").replace(DIAC,"");
TXT.ar=TXT.ar.map(norm);TXT.en=TXT.en.map(norm);
const SUN='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
const isDark=()=>{const d=document.documentElement;return d.dataset.theme==="dark"||(!d.dataset.theme&&matchMedia("(prefers-color-scheme:dark)").matches)};
function themeIcon(){const d=isDark();$("#theme").setAttribute("aria-pressed",d);$("#theme").innerHTML=d?SUN:MOON}
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
let L=(navigator.language||"ar").startsWith("en")?"en":"ar";
const KEY="typing-game-v1";
let G=null,tick=null,lastIdx={},S={mode:"timed",time:"60",d:60,tl:"ar",custom:45};

// ===== Storage (TODO: replace with server API, e.g. POST /api/scores) =====
const load=()=>{try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}};
const save=a=>{try{localStorage.setItem(KEY,JSON.stringify(a.slice(-100)))}catch(e){}};

function applyLang(){
 document.documentElement.lang=L;document.documentElement.dir=L==="ar"?"rtl":"ltr";
 $$("[data-i]").forEach(e=>e.textContent=I[L][e.dataset.i]);
 $$("[data-al]").forEach(e=>{e.setAttribute("aria-label",I[L][e.dataset.al]);e.title=I[L][e.dataset.al]});
 $("#lang").textContent=I[L].lang;themeIcon();
 modeHint();renderHist();
 if(G){ui();hud();if(G.res)showRes()}
}
function modeHint(){$("#modeHint").textContent=I[L][$("input[name=mode]:checked").value==="timed"?"hint1":"hint2"]}

function dur(){
 const v=$("input[name=time]:checked").value;if(v!=="custom")return +v;
 const n=+$("#cust").value,ok=Number.isInteger(n)&&n>=10&&n<=600;
 $("#cust").setAttribute("aria-invalid",!ok);$("#custErr").textContent=ok?"":I[L].errRange;return ok?n:null;
}
function pick(lang){
 if(lang==="mix")lang=Math.random()<.5?"ar":"en";
 const a=TXT[lang];let i;do{i=Math.floor(Math.random()*a.length)}while(a.length>1&&i===lastIdx[lang]);
 lastIdx[lang]=i;return{lang,t:a[i]};
}
// prepare a fresh passage (idle state)
function prepare(){
 clearInterval(tick);const p=pick(S.tl);
 G={mode:S.mode,d:S.d,tl:S.tl,lang:p.lang,target:p.t,t0:0,typed:0,err:0,del:0,pv:"",done:false,run:false};
 const i=$("#in");i.value="";i.disabled=true;i.dir=$("#text").dir=p.lang==="ar"?"rtl":"ltr";i.lang=p.lang;
 $("#res").classList.remove("show");$("#rGrid").innerHTML="";$("#rBadge").hidden=true;$("#rEmpty").hidden=false;
 render();hud();ui();
}
function ui(){
 const T=I[L];
 $("#start").textContent=(G.done||G.run)?T.restart:T.start;
 $("#quit").hidden=!(G.run&&G.t0);
 $("#sum").textContent=(S.mode==="timed"?T.mT+" · "+S.d+" "+T.s:T.mP)+" · "+(S.tl==="ar"?"العربية":S.tl==="en"?"English":T.random);
}
function begin(){
 if(G.run||G.done)prepare();
 G.run=true;$("#in").disabled=false;$("#in").focus();ui();
}
function render(){
 const v=$("#in").value,t=G.target;let h="";
 for(let i=0;i<t.length;i++){
  const c=t[i].replace(/&/g,"&amp;").replace(/</g,"&lt;");
  const k=i<v.length?(v[i]===t[i]?"c":"x"):(i===v.length?"cur":"");
  h+=k?`<span class="${k}">${c}</span>`:c;
 }
 const box=$("#text");box.innerHTML=h;
 const cur=box.querySelector(".cur");if(cur)box.scrollTop=Math.max(0,cur.offsetTop-box.clientHeight/2);
}
function stats(){
 const v=$("#in").value,t=G.target,el=G.t0?(performance.now()-G.t0)/1000:0;
 let cc=0;for(let i=0;i<v.length&&i<t.length;i++)if(v[i]===t[i])cc++;
 const tw=t.split(/\s+/),vw=v.split(/\s+/);let cw=0;
 vw.forEach((w,i)=>{if(w&&w===tw[i]&&(i<vw.length-1||v.length>=t.length||t[v.length]===" "))cw++});
 const m=el/60,wpm=m>0?Math.round(cc/5/m):0,raw=m>0?Math.round(G.typed/5/m):0;
 const acc=G.typed?Math.round((G.typed-G.err)/G.typed*100):100;
 return{el,cc,cw,wpm,raw,acc};
}
function hud(){
 const s=stats();
 $("#hT").textContent=G.mode==="timed"?Math.max(0,Math.ceil(G.d-s.el))+I[L].s:Math.floor(s.el)+I[L].s;
 $("#hW").textContent=s.wpm;$("#hA").textContent=s.acc+"%";$("#hE").textContent=G.err;
 const pr=G.mode==="timed"?s.el/G.d:$("#in").value.length/G.target.length;
 const pct=Math.min(100,Math.round(pr*100));$("#pbi").style.width=pct+"%";$("#pb").setAttribute("aria-valuenow",pct);
}
function onInput(){
 if(!G||G.done||!G.run)return;
 const el=$("#in");let v=norm(el.value);if(v!==el.value)el.value=v; // drop diacritics / invisible marks
 if(!G.t0){G.t0=performance.now();tick=setInterval(loop,100);ui()}
 let k=0;const p=G.pv;while(k<p.length&&k<v.length&&p[k]===v[k])k++; // common prefix
 G.del+=p.length-k;
 for(let i=k;i<v.length;i++){G.typed++;if(v[i]!==G.target[i])G.err++} // judge each new character on its own
 G.pv=v;
 if(G.mode==="timed"&&v.length>G.target.length-30){G.target+=" "+pick(G.tl==="mix"?G.lang:G.tl).t}
 render();hud();
 if(G.mode==="passage"&&v.length>=G.target.length)finish();
}
function loop(){if(!G||G.done)return clearInterval(tick);hud();if(G.mode==="timed"&&(performance.now()-G.t0)/1000>=G.d)finish()}
function finish(){
 if(!G||G.done||!G.t0)return;
 G.done=true;G.run=false;clearInterval(tick);$("#in").disabled=true;
 const s=stats();G.res=s;
 const all=load(),prevBest=all.reduce((m,r)=>Math.max(m,r.wpm),0);
 G.record=s.wpm>prevBest&&s.wpm>0;
 all.push({ts:Date.now(),wpm:s.wpm,raw:s.raw,acc:s.acc,words:s.cw,mode:G.mode,el:+s.el.toFixed(1),err:G.err,del:G.del,typed:G.typed,cc:s.cc});
 save(all); // TODO: await fetch('/api/scores',{method:'POST',body:JSON.stringify(...)})
 hud();showRes(true);renderHist();ui();$("#start").focus();
 $("#res").scrollIntoView({block:"nearest"});
}
function showRes(anim){
 const s=G.res,T=I[L],card=$("#res");
 const lv=s.wpm>=70?3:s.wpm>=45?2:s.wpm>=25?1:0;
 const b=$("#rBadge");b.hidden=false;b.textContent=G.record?T.rec:T.lvl[lv];
 const rows=[[s.wpm,T.wpmL],[s.acc,T.accL,"%"],[s.cw,T.wordsT],[s.raw,T.raw],[s.el,T.time2,T.s,1],[s.cc,T.chars],[G.typed,T.typedAll],[G.err,T.errT],[G.del,T.del]];
 $("#rGrid").innerHTML=rows.map((r,i)=>`<div style="--i:${i}"><b data-n="${r[0]}" data-u="${r[2]||""}" data-d="${r[3]||0}"></b><span>${r[1]}</span></div>`).join("");
 const red=matchMedia("(prefers-reduced-motion:reduce)").matches;
 $$("#rGrid b").forEach(e=>{const n=+e.dataset.n,d=+e.dataset.d,u=e.dataset.u,set=v=>e.textContent=v.toFixed(d)+u;
  if(!anim||red){set(n);return}
  const t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/800);set(n*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)})(t0)});
 $("#rEmpty").hidden=true;card.classList.remove("show");
 if(anim&&!red){void card.offsetWidth;card.classList.add("show")}
}
function renderHist(){
 const a=load(),T=I[L],has=a.length>0;
 $("#noHist").hidden=has;$("#clear").hidden=!has;$("#hist table").hidden=!has;
 const w=a.map(r=>r.wpm),f=n=>new Intl.NumberFormat(L==="ar"?"ar-EG-u-nu-latn":"en").format(n);
 $("#hGrid").innerHTML=has?[[Math.max(...w),T.best],[Math.min(...w),T.worst],[Math.round(w.reduce((x,y)=>x+y,0)/a.length),T.avg],[a.length,T.games],[a.reduce((x,r)=>x+r.words,0),T.totalW],[Math.max(...a.map(r=>r.acc))+"%",T.bestAcc]].map(r=>`<div><b>${f(r[0])}</b><span>${r[1]}</span></div>`).join(""):"";
 $("#hBody").innerHTML=a.slice(-3).reverse().map(r=>`<tr><td>${new Date(r.ts).toLocaleDateString(L==="ar"?"ar":"en-GB",{day:"numeric",month:"short"})}</td><td>${r.wpm}</td><td>${r.acc}%</td><td>${r.words}</td><td>${r.mode==="timed"?T.mT:T.mP}</td></tr>`).join("");
}
// ===== Settings dialog =====
function openDlg(){
 $('input[name=mode][value="'+S.mode+'"]').checked=true;
 $('input[name=time][value="'+S.time+'"]').checked=true;
 $('input[name=tl][value="'+S.tl+'"]').checked=true;
 $("#cust").value=S.custom;$("#cust").removeAttribute("aria-invalid");$("#custErr").textContent="";
 $("#customBox").hidden=S.time!=="custom";$("#timeSet").hidden=S.mode!=="timed";
 modeHint();$("#dlg").showModal();
}
function apply(){
 const mode=$("input[name=mode]:checked").value;let d=null;
 if(mode==="timed"){d=dur();if(d===null){$("#cust").focus();return}}
 S={mode,time:$("input[name=time]:checked").value,d,tl:$("input[name=tl]:checked").value,custom:$("#cust").value};
 $("#dlg").close();prepare();$("#gear").focus();
}
// ===== Events =====
$("#start").onclick=begin;$("#quit").onclick=finish;
$("#shuffle").onclick=()=>{prepare();$("#start").focus()};
$("#gear").onclick=openDlg;$("#apply").onclick=apply;$("#cancel").onclick=()=>$("#dlg").close();
$("#in").addEventListener("input",onInput);
["mouseup","keyup","focus"].forEach(e=>$("#in").addEventListener(e,()=>{const i=$("#in"),n=i.value.length;if(i.selectionStart!==n||i.selectionEnd!==n)i.setSelectionRange(n,n)})); // caret stays at the end
["paste","drop","cut"].forEach(e=>$("#in").addEventListener(e,ev=>ev.preventDefault()));
$("#lang").onclick=()=>{L=L==="ar"?"en":"ar";applyLang()};
$("#theme").onclick=()=>{document.documentElement.dataset.theme=isDark()?"light":"dark";themeIcon()};
$("#clear").onclick=()=>{if(confirm(I[L].confirm)){save([]);renderHist()}};
$$("input[name=mode]").forEach(e=>e.onchange=()=>{modeHint();$("#timeSet").hidden=e.value!=="timed"});
$$("input[name=time]").forEach(e=>e.onchange=()=>{$("#customBox").hidden=$("input[name=time]:checked").value!=="custom";dur()});
$("#cust").addEventListener("input",dur);
$("#histBtn").onclick=()=>$("#hdlg").showModal();$("#hclose").onclick=()=>$("#hdlg").close();
applyLang();prepare();
</script>
</body>
</html>
